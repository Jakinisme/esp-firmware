 ; ============================================================
;  PlatformIO Configuration — ESP32 + PWM 50Hz
;  Protocol  : PWM 50Hz (BLHeli_S 3D mode, 1000–2000µs)
;  Hardware  : ESP32 DevKit (240 MHz dual-core)
;  Driver    : ESP32 LEDC peripheral (hardware PWM)
;  Author    : Jaki
; ============================================================

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino
monitor_filters = send_on_enter, default

; ---------- Build flags ----------
build_flags =
    -DCORE_DEBUG_LEVEL=0        ; 0=none … 5=verbose (set 3 saat debug)
    -DBOARD_HAS_PSRAM=0 
    -DARDUINO_ESP32_DEV
    -I src                      ; resolve "header/..." and "lib/..." includes

; ---------- Upload & Monitor ----------
monitor_speed   = 115200
upload_speed    = 921600